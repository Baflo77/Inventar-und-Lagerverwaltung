<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Delivery Manager</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">

    <style>
        :root {
            --bg-main: #ebedef;
            --header-bg: #2c3e50;
            --card-bg: #ffffff;
            --text-main: #2f3640;
            --accent-color: #3498db;
            --danger-color: #e74c3c;
            --shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        body { margin:0; font-family: Arial, Helvetica, sans-serif; background: var(--bg-main); color: var(--text-main); }
        header { background: var(--header-bg); color: white; padding: 18px 30px; font-size: 1.4rem; font-weight: bold; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .page-title { font-size: 1.8rem; margin-bottom: 5px; }
        .page-subtitle { color: #7f8c8d; margin-bottom: 25px; }

        .toolbar-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: var(--shadow);
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 12px;
            align-items: center;
            margin-bottom: 25px;
        }

        .search-input { padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }

        .btn {
            border: none;
            padding: 12px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-primary { background: var(--accent-color); color: white; }
        .btn-light { background: #f1f2f6; color: var(--text-main); }

        .data-card { background: var(--card-bg); border-radius: 8px; box-shadow: var(--shadow); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8f9fa; text-align: left; padding: 15px; font-size: 14px; color: #7f8c8d; }
        td { padding: 15px; border-top: 1px solid #eee; }

        .actions a { text-decoration: none; font-weight: bold; margin-right: 12px; }
        .edit { color: var(--accent-color); }
        .delete { color: var(--danger-color); }

        .empty-state { text-align: center; padding: 60px; color: #bdc3c7; }
    </style>
</head>
<body>

<header>
    Lagerverwaltung – Delivery Manager
</header>

<div class="container">
    <div class="page-title">Lieferungen</div>
    <div class="page-subtitle">Anlegen, bearbeiten und verwalten</div>

    <div class="toolbar-card">
        <input class="search-input" type="text" placeholder="Suche nach Lieferung, Datum, Status …">

        <a class="btn btn-light" href="/">
            <i class="bi bi-house"></i> Dashboard
        </a>

        <a class="btn btn-primary" href="/deliveries/create/">
            <i class="bi bi-plus-circle"></i> Lieferung anlegen
        </a>
    </div>

    <div class="data-card">
        <table>
            <thead>
                <tr>
                    <th>Liefernummer</th>
                    <th>Datum</th>
                    <th>Status</th>
                    <th>Empfänger</th>
                    <th>Aktionen</th>
                </tr>
            </thead>
            <tbody>
                <!-- Dummy-Zeile (später durch DB ersetzen) -->
                <tr>
                    <td>DEL-1001</td>
                    <td>03.01.2026</td>
                    <td>In Bearbeitung</td>
                    <td>Max Mustermann</td>
                    <td class="actions">
                        <a href="#" class="edit"><i class="bi bi-pencil"></i> Edit</a>
                        <a href="#" class="delete"><i class="bi bi-trash"></i> Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- Optional: leere Ansicht -->
        <!--
        <div class="empty-state">
            <i class="bi bi-truck"></i>
            <p>Keine Lieferungen vorhanden.</p>
        </div>
        -->
    </div>
</div>

</body>
</html>
