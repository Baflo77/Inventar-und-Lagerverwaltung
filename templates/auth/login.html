<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Login</title>
</head>
<body>
  <h1>Anmeldung</h1>

  {% if form.errors %}
    <p style="color:red;">Login fehlgeschlagen. Bitte prüfen.</p>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Anmelden</button>
  </form>
</body>
</html>
