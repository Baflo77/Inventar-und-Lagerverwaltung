<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Customer Manager</title>

    <!-- Icons wie beim Kollegen -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">

    <style>
        :root {
            --bg-main: #ebedef;
            --header-bg: #2c3e50;
            --card-bg: #ffffff;
            --text-main: #2f3640;
            --accent-color: #3498db;
            --danger-color: #e74c3c;
            --shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
        }

        header {
            background: var(--header-bg);
            color: white;
            padding: 18px 30px;
            font-size: 1.4rem;
            font-weight: bold;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .page-title {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .page-subtitle {
            color: #7f8c8d;
            margin-bottom: 25px;
        }

        .toolbar-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: var(--shadow);
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 12px;
            align-items: center;
            margin-bottom: 25px;
        }

        .search-input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        .btn {
            border: none;
            padding: 12px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--accent-color);
            color: white;
        }

        .btn-light {
            background: #f1f2f6;
            color: var(--text-main);
        }

        .data-card {
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f8f9fa;
            text-align: left;
            padding: 15px;
            font-size: 14px;
            color: #7f8c8d;
        }

        td {
            padding: 15px;
            border-top: 1px solid #eee;
        }

        .actions a {
            text-decoration: none;
            font-weight: bold;
            margin-right: 12px;
        }

        .edit {
            color: var(--accent-color);
        }

        .delete {
            color: var(--danger-color);
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: #bdc3c7;
        }
    </style>
</head>
<body>

<header>
    Lagerverwaltung – Customer Manager
</header>

<div class="container">

    <div class="page-title">Kunden</div>
    <div class="page-subtitle">Anlegen, bearbeiten und verwalten</div>

    <div class="toolbar-card">
        <input class="search-input" type="text" placeholder="Suche nach Name, E-Mail, PLZ …">

        <button class="btn btn-light">
            <i class="bi bi-house"></i> Dashboard
        </button>

        <button class="btn btn-primary">
            <i class="bi bi-person-plus"></i> Kunde anlegen
        </button>
    </div>

    <div class="data-card">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>E-Mail</th>
                    <th>Telefon</th>
                    <th>Adresse</th>
                    <th>Aktionen</th>
                </tr>
            </thead>
            <tbody>
                {% for c in customers %}
                <tr>
                    <td>{{ c.name }}</td>
                    <td>{{ c.email }}</td>
                    <td>{{ c.phone }}</td>
                    <td>{{ c.street }} {{ c.house_number }}, {{ c.zip }} {{ c.city }}</td>
                    <td class="actions">
                        <a href="#" class="edit">Edit</a>
                        <a href="#" class="delete">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <!-- Leer-Zustand wie beim Kollegen -->
        <!--
        <div class="empty-state">
            <i class="bi bi-person"></i>
            <p>Keine Kunden vorhanden</p>
        </div>
        -->
    </div>

</div>

</body>
</html>
